[package]
name = "thes"
version = "0.1.0"
edition = "2024"
description = "A lightning-fast terminal thesaurus"
license = "MIT"

[lib]
name = "thes"
path = "src/lib.rs"

[[bin]]
name = "thes"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0.0"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tantivy = "0.27"
tokio = { version = "1.54.1", features = ["rt"] }
turso = { version = "0.8.3", default-features = false }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
