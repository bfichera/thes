[package]
name = "thes"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightning-fast offline terminal thesaurus with vim keys"
license = "MIT"
authors = ["Bryan Fichera <bfichera@anl.gov>"]
repository = "https://github.com/bfichera/thes"
homepage = "https://github.com/bfichera/thes"

[lib]
name = "thes"
path = "src/lib.rs"

[[bin]]
name = "thes"
path = "src/main.rs"

[features]
default = ["embed-data"]
# Ship the WordNet source inside the binary so `thes` works offline on first run.
embed-data = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29"
dirs = "7.0.0"
ratatui = "0.30"
ruzstd = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tantivy = "0.27"
tokio = { version = "1.54.1", features = ["rt"] }
turso = { version = "0.8.3", default-features = false }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
