name: release

# Push a tag like v0.1.0 (matching Cargo.toml) to build and publish everything.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, targets: x86_64-unknown-linux-musl }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, targets: aarch64-unknown-linux-musl }
          # One macOS runner builds both targets, since macOS runners are scarce.
          - { name: macos, os: macos-latest, targets: "aarch64-apple-darwin x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Install musl toolchain
        if: contains(matrix.targets, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.targets }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: |
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
            cargo build --release --locked --target "$target"
            mkdir -p "stage/thes-$target"
            cp "target/$target/release/thes" "stage/thes-$target/thes"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: stage
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true

      - name: Package
        run: |
          mkdir dist
          for dir in bin/thes-*; do
            name=$(basename "$dir")
            chmod +x "$dir/thes"
            cp LICENSE LICENSE-WORDNET README.md "$dir/"
            tar -C bin -czf "dist/$name.tar.gz" "$name"
          done
          cp scripts/install.sh scripts/uninstall.sh dist/
          cd dist
          sha256sum -- * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
