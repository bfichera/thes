name: release

# Push a tag like v0.1.0 (matching Cargo.toml) to build and publish everything.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"

      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: thes-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/thes
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: bin

      - name: Package
        run: |
          mkdir dist
          for dir in bin/thes-*; do
            name=$(basename "$dir")
            chmod +x "$dir/thes"
            cp LICENSE LICENSE-WORDNET README.md "$dir/"
            tar -C bin -czf "dist/$name.tar.gz" "$name"
          done
          cp scripts/install.sh dist/
          cd dist
          sha256sum -- * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
