name: release

# Push a tag like v0.1.0 (matching Cargo.toml) to build and publish everything.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"

      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: thes-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/thes
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: bin

      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

      - name: Update Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/bfichera/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp pkg/thes.rb tap/Formula/thes.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/thes.rb
          git commit -m "thes $GITHUB_REF_NAME"
          git push

      - name: Update AUR (thes-tui-bin)
        if: env.AUR_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/thes-tui-bin.git aur
          cp pkg/aur/PKGBUILD pkg/aur/.SRCINFO aur/
          cd aur
          git config user.name "Bryan Fichera"
          git config user.email "bfichera@anl.gov"
          git add PKGBUILD .SRCINFO
          git commit -m "thes $GITHUB_REF_NAME"
          git push origin HEAD:master

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
