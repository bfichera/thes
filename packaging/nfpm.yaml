# Used by scripts/package.sh; ${VAR}s are filled from the environment.
name: thes
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
maintainer: Bryan Fichera <bfichera@anl.gov>
description: A lightning-fast offline terminal thesaurus with vim keys
homepage: https://github.com/bfichera/thes
license: MIT
contents:
  - src: ${STAGE}/thes
    dst: /usr/bin/thes
    file_info:
      mode: 0755
  - src: ${STAGE}/thes.1
    dst: /usr/share/man/man1/thes.1
  - src: ${STAGE}/completions/thes.bash
    dst: /usr/share/bash-completion/completions/thes
  - src: ${STAGE}/completions/_thes
    dst: /usr/share/zsh/site-functions/_thes
  - src: ${STAGE}/completions/thes.fish
    dst: /usr/share/fish/vendor_completions.d/thes.fish
  - src: ${STAGE}/LICENSE
    dst: /usr/share/doc/thes/LICENSE
  - src: ${STAGE}/LICENSE-WORDNET
    dst: /usr/share/doc/thes/LICENSE-WORDNET
